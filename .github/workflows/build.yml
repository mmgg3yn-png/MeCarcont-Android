name: MeCarcont APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate App Icon
        if: hashFiles('app_icon_source.jpg') != ''
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src = Image.open("app_icon_source.jpg").convert("RGBA")
          root = Path("app/src/main/res")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = root / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)

              canvas = Image.new("RGBA", (size, size), "#121212")
              icon = ImageOps.contain(src, (size-4, size-4))
              canvas.alpha_composite(
                  icon, ((size-icon.width)//2, (size-icon.height)//2)
              )
              canvas.save(folder / "ic_launcher.png")

          folder = root / "mipmap-anydpi-v26"
          folder.mkdir(parents=True, exist_ok=True)

          fg = Image.new("RGBA", (432,432), (0,0,0,0))
          icon = ImageOps.contain(src, (360,360))
          fg.alpha_composite(icon, ((432-icon.width)//2,
                                    (432-icon.height)//2))
          fg.save(folder / "ic_launcher_foreground.png")
          PY

      - name: Adaptive Icon
        if: hashFiles('app_icon_source.jpg') != ''
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <resources>
            <color name="ic_launcher_background">#121212</color>
          </resources>
          XML

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeCarcont-Updated-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
